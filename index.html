    <!-- Early theme color application - synchronous to prevent flash -->
    <script>
      (function () {
        var c = localStorage.getItem('coho-theme-color');
        if (c) {
          var s = document.documentElement.style;
          s.setProperty('--sl-color-primary-600', c);
          s.setProperty('--sl-color-primary-500', c);
          s.setProperty('--sl-color-primary-700', c);
          s.setProperty('--md-sys-color-primary', c);
          s.setProperty('--md-sys-color-outline', c);
        }
      })();
    </script>

    <style>
      :root {
        --font-family:
          system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans',
          sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji';

        --sl-font-size-medium: 16px;
      }

      /* MD3 Motion - Cross-fade animation */
      @keyframes fade-in {
        from {
          opacity: 0;
          transform: translateY(1%);
        }
        to {
          opacity: 1;
          transform: translateY(0%);
        }
      }

      @keyframes fade-out {
        from {
          opacity: 1;
          transform: translateY(0%);
        }
        to {
          opacity: 0;
          transform: translateY(1%);
        }
      }

      /* Simple cross-fade - noticeable but not distracting */
      @media (prefers-reduced-motion: no-preference) {
        ::view-transition-old(root) {
          animation: 210ms ease-out both fade-out;
        }

        ::view-transition-new(root) {
          animation: 210ms ease-in both fade-in;
        }
      }

      /* Skip navigation link */
      .skip-link {
        position: absolute;
        top: -100%;
        left: 16px;
        z-index: 100001;
        padding: 8px 16px;
        background: var(--md-sys-color-primary, #6750a4);
        color: var(--md-sys-color-on-primary, #fff);
        border-radius: 0 0 8px 8px;
        text-decoration: none;
        font-weight: 500;
        font-size: 14px;
        transition: top 0.15s ease;
      }

      .skip-link:focus {
        top: 0;
      }

      html,
      body {
        font-family: var(--font-family);
        font-size: var(--sl-font-size-medium);
        padding: 0;
        margin: 0;

        overflow: hidden;
      }

      body {
        min-height: 100vh;
        background-color: var(--md-sys-color-background);
        color: var(--md-sys-color-on-background);
      }

      /* Layout Tokens */
      :root {
        --layout-max-width: 1200px;
        --layout-nav-width: 80px;
        --layout-sidebar-width: 320px;
        --layout-gap: 32px;
        --layout-sidebar-padding: 16px;

        background-color: var(--md-sys-color-background);
      }
    </style>

  <body>
    <!--
      Android intent:// fallback for OAuth callback.
      When App Link verification fails, the Chrome Custom Tab loads this page
      instead of handing the URL back to the app. This script detects that
      scenario and uses an intent:// URI with an explicit package to deliver
      the callback directly to the app, bypassing App Link verification.
    -->
    <script>
      (function () {
        if (
          window.location.pathname.startsWith('/auth/callback') &&
          !window.Capacitor &&
          /Android/i.test(navigator.userAgent)
        ) {
          var params = new URLSearchParams(window.location.search);
          if (params.get('code') && params.get('state')) {
            var target =
              'intent://coho.place' +
              window.location.pathname +
              window.location.search +
              '#Intent;scheme=https;package=place.coho.app;end';
            window.location.replace(target);
          }
        }
      })();
    </script>

    <!-- Our app-index web component. This component is defined in src/pages/app-index.ts-->
    <app-index></app-index>

    <script>
      const themeSetting = window.matchMedia('(prefers-color-scheme: dark)');
      const theme = themeSetting.matches ? 'dark' : 'light';

      document.body.classList.add(`sl-theme-${theme}`);

      themeSetting.addEventListener('change', (e) => {
        document.body.classList.remove('sl-theme-light', 'sl-theme-dark');
        document.body.classList.add(`sl-theme-${e.matches ? 'dark' : 'light'}`);
      });
    </script>

    <script>
      window.requestIdleCallback =
        window.requestIdleCallback ||
        function (cb) {
          var start = Date.now();
          return setTimeout(function () {
            cb({
              didTimeout: false,
              timeRemaining: function () {
                return Math.max(0, 50 - (Date.now() - start));
              },
            });
          }, 1);
        };

      window.cancelIdleCallback =
        window.cancelIdleCallback ||
        function (id) {
          clearTimeout(id);
        };
    </script>

    <!-- register service worker -->
    <script>
      window.onload = () => {
        // delay service worker registration to prioritize loading
        setTimeout(() => {
          if ('serviceWorker' in navigator) {
            const swUrl = '/sw.js';
            const swOptions = { scope: '/', type: 'module' };

            let refreshing = false;

            // Listen for controller change (when new SW takes over)
            navigator.serviceWorker.addEventListener('controllerchange', () => {
              if (refreshing) return;
              refreshing = true;
              window.location.reload();
            });

            // Listen for SW_ACTIVATED message
            navigator.serviceWorker.addEventListener('message', (event) => {
              if (event.data && event.data.type === 'SW_ACTIVATED') {
                if (!refreshing) {
                  refreshing = true;
                  window.location.reload();
                }
              }
            });

            navigator.serviceWorker.register(swUrl, swOptions).then((reg) => {
              console.log('[SW] Registered');

              // Check for waiting worker
              if (reg.waiting) {
                dispatchUpdateEvent(reg.waiting);
              }

              reg.addEventListener('updatefound', () => {
                const newWorker = reg.installing;
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    dispatchUpdateEvent(newWorker);
                  }
                });
              });
            });

            function dispatchUpdateEvent(worker) {
              window.dispatchEvent(
                new CustomEvent('pwa-update-available', {
                  detail: {
                    updateServiceWorker: () => {
                      worker.postMessage({ type: 'SKIP_WAITING' });
                    },
                  },
                })
              );
            }
          }
        }, 15000);
      };
    </script>
