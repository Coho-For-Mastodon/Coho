    <!-- light mode and dark mode CSS -->
    <style media="(prefers-color-scheme:light)">
      :root,
      :host,
      .sl-theme-light {
        --sl-color-gray-50: hsl(0 0% 97.5%);
        --sl-color-gray-100: hsl(240 4.8% 95.9%);
        --sl-color-gray-200: hsl(240 5.9% 90%);
        --sl-color-gray-300: hsl(240 4.9% 83.9%);
        --sl-color-gray-400: hsl(240 5% 64.9%);
        --sl-color-gray-500: hsl(240 3.8% 46.1%);
        --sl-color-gray-600: hsl(240 5.2% 33.9%);
        --sl-color-gray-700: hsl(240 5.3% 26.1%);
        --sl-color-gray-800: hsl(240 3.7% 15.9%);
        --sl-color-gray-900: hsl(240 5.9% 10%);
        --sl-color-gray-950: hsl(240 7.3% 8%);

        /* Primary colors - dynamically set via JS for theming */
        --sl-color-primary-500: hsl(217 91% 60%);
        --sl-color-primary-600: hsl(217 91% 60%);
        --sl-color-primary-700: hsl(217 91% 50%);

        --sl-color-neutral-50: var(--sl-color-gray-50);
        --sl-color-neutral-100: var(--sl-color-gray-100);
        --sl-color-neutral-200: var(--sl-color-gray-200);
        --sl-color-neutral-300: var(--sl-color-gray-300);
        --sl-color-neutral-400: var(--sl-color-gray-400);
        --sl-color-neutral-500: var(--sl-color-gray-500);
        --sl-color-neutral-600: var(--sl-color-gray-600);
        --sl-color-neutral-700: var(--sl-color-gray-700);
        --sl-color-neutral-800: var(--sl-color-gray-800);
        --sl-color-neutral-900: var(--sl-color-gray-900);
        --sl-color-neutral-950: var(--sl-color-gray-950);

        --sl-color-neutral-0: hsl(0, 0%, 100%);
        --sl-color-neutral-1000: hsl(0, 0%, 0%);

        --sl-border-radius-small: 0.1875rem;
        --sl-border-radius-medium: 0.25rem;
        --sl-border-radius-large: 0.5rem;
        --sl-border-radius-x-large: 1rem;

        --sl-border-radius-circle: 50%;
        --sl-border-radius-default: 9999px;

        /* Font - only keeping medium which is used */
        --sl-font-size-medium: 1rem;

        /* Panel - used by several components */
        --sl-panel-background-color: var(--sl-color-neutral-0);
        --sl-panel-border-color: var(--sl-color-neutral-200);
      }
    </style>
    <link rel="stylesheet" media="(prefers-color-scheme:dark)" href="/dark.css" />
    <link rel="stylesheet" href="/src/styles/md-tokens.css" />

    <style>
      :root {
        --font-family:
          system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans',
          sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji';

        --sl-color-primary-600: rgb(92 134 255);

        --sl-font-size-medium: 16px;
      }

      @keyframes fade-in {
        from {
          opacity: 0;
        }
      }

      @keyframes fade-out {
        to {
          opacity: 0;
        }
      }

      @keyframes slide-from-right {
        from {
          transform: translateX(-30px);
        }
      }

      @keyframes slide-to-left {
        to {
          transform: translateX(-30px);
        }
      }

      ::view-transition-old(root) {
        animation:
          90ms cubic-bezier(0.4, 0, 1, 1) both fade-out,
          300ms cubic-bezier(0.4, 0, 0.2, 1) both slide-to-left;
      }

      ::view-transition-new(root) {
        animation:
          210ms cubic-bezier(0, 0, 0.2, 1) 90ms both fade-in,
          300ms cubic-bezier(0.4, 0, 0.2, 1) both slide-from-right;
      }

      html,
      body {
        font-family: var(--font-family);
        font-size: var(--sl-font-size-medium);
        padding: 0;
        margin: 0;

        overflow: hidden;
      }

      body {
        min-height: 100vh;
      }

      /* MD3 Color Tokens */
      :root {
        /* Light mode MD3 background colors */
        --md-sys-color-background: #ffffff;
        --md-sys-color-surface: color-mix(in srgb, var(--md-sys-color-primary) 10%, white);
        --md-sys-color-on-background: #1d1b20;

        background-color: var(--md-sys-color-background);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          /* Dark mode MD3 background colors */
          --md-sys-color-background: #181818;
          --md-sys-color-surface: color-mix(in srgb, var(--md-sys-color-primary) 8%, #121212);
          --md-sys-color-on-background: #e6e1e5;

          background-color: var(--md-sys-color-background);
        }

        body {
          background-color: var(--md-sys-color-background);
          color: var(--md-sys-color-on-background);
        }
      }

      @media (prefers-color-scheme: light) {
        body {
          background-color: var(--md-sys-color-background);
          color: var(--md-sys-color-on-background);
        }
      }

      #updateToast {
        position: fixed;
        z-index: 99999;
        right: 16px;
        bottom: 16px;
        background: var(--primary-color);
        color: black;

        padding: 10px;
        border-radius: 6px;
        flex-direction: column;
        display: none;
      }

      #updateButton {
        align-self: flex-end;
        width: 6em;
      }

      md-button::part(control) {
        border: none;
      }
    </style>

    <script type="module" src="/src/app-index.ts"></script>

  <body>
    <!-- Our app-index web component. This component is defined in src/pages/app-index.ts-->
    <app-index></app-index>

    <script>
      const themeSetting = window.matchMedia('(prefers-color-scheme: dark)');
      const theme = themeSetting.matches ? 'dark' : 'light';

      document.body.classList.add(`sl-theme-${theme}`);

      themeSetting.addEventListener('change', (e) => {
        document.body.classList.remove(`sl-theme-${theme}`);
        document.body.classList.add(`sl-theme-${e.matches ? 'dark' : 'light'}`);
      });
    </script>

    <div id="updateToast">
      <strong>Update Available</strong>
      <p>Click reload to complete update. This wil be very quick.</p>

      <md-button variant="filled" id="updateButton">Reload</md-button>
    </div>

    <script>
      window.requestIdleCallback =
        window.requestIdleCallback ||
        function (cb) {
          var start = Date.now();
          return setTimeout(function () {
            cb({
              didTimeout: false,
              timeRemaining: function () {
                return Math.max(0, 50 - (Date.now() - start));
              },
            });
          }, 1);
        };

      window.cancelIdleCallback =
        window.cancelIdleCallback ||
        function (id) {
          clearTimeout(id);
        };
    </script>

    <!-- register service worker -->
    <script>
      if ('serviceWorker' in navigator) {
        let registration;

        const promptForUpdate = async () => {
          const updateToast = document.getElementById('updateToast');
          updateToast.style.display = 'flex';

          return new Promise((resolve) => {
            const updateButton = document.getElementById('updateButton');
            updateButton.addEventListener('click', () => {
              updateToast.style.display = 'none';
              resolve(true);
            });
          });
        };

        // In dev mode, vite-plugin-pwa serves the SW at a different path with type: module
        const isDev = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        const swUrl = isDev ? '/dev-sw.js?dev-sw' : '/sw.js';
        const swOptions = isDev ? { type: 'module' } : undefined;

        navigator.serviceWorker.register(swUrl, swOptions).then((reg) => {
          registration = reg;

          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;

            newWorker.addEventListener('statechange', async () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                const updateAccepted = await promptForUpdate();
                if (updateAccepted) {
                  newWorker.postMessage({ type: 'SKIP_WAITING' });
                }
              }
            });
          });
        }).catch((error) => {
          console.log('[SW] Registration failed:', error);
        });

        navigator.serviceWorker.addEventListener('controllerchange', () => {
          window.location.reload();
        });
      }
    </script>
  </body>
