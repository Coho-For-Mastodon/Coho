name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

# Cancel in-progress deployments when a new commit is pushed
concurrency:
  group: firebase-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # RUN CI CHECKS FIRST (reusable workflow)
  # ============================================

  ci:
    name: CI
    uses: ./.github/workflows/ci-reusable.yml

  # ============================================
  # DEPLOY TO PRODUCTION (only after all checks pass)
  # ============================================

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [ci]
    steps:
      - uses: actions/checkout@v4

      # Download pre-built artifact instead of rebuilding
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COHO_MASTODON }}
          channelId: live
          projectId: coho-mastodon
