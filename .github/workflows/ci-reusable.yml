name: CI (Reusable)

on:
  workflow_call:

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Check translations
        run: |
          npm run localize:extract
          git diff --exit-code xliff/ || (echo "Error: Translation files are out of sync. Run 'npm run localize:extract' and commit the changes." && exit 1)

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Unit tests
        run: npm run test:run

      - name: Build production bundle
        run: npm run build

      - name: Performance & bundle size tests
        run: npx playwright test --config playwright.perf.config.ts
        env:
          # Skip the webServer build since we already built above
          CI: ""

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  build-functions:
    name: Build Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: functions
        run: npm ci

      - name: Build
        working-directory: functions
        run: npm run build
